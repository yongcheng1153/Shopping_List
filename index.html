          <span class="sl-m-thumb">${m.images && m.images[0] ? `<img data-img="${m.images[0]}" alt="">` : ICON.tileEmpty}</span>
          <span class="sl-m-body">
            <span class="sl-m-name">${catLabel(m)}${esc(m.name)}${isBest ? `<span class="sl-best-tag">${ICON.crown}最便宜</span>` : ''}</span>
            <span class="sl-m-prices">
              ${ps.length
                ? ps.map((p, k) => `<span class="sl-price-chip${k === 0 && many ? ' best' : ''}">${esc(p.store)} ${fmt(p.price)}</span>`).join('')
                : '<span class="sl-m-none">尚未填價格・點此填寫</span>'}
            </span>
          </span>
          <span class="sl-m-low">${b ? fmt(b.price) : '—'}</span>
        </button>
        <button type="button" class="sl-icon-btn" data-act="member-menu" aria-label="更多選項">${ICON.more}</button>
      </li>`;
  }

  async function addGroupFromPage() {
    const name = await ask({ title: '新增比價群組', placeholder: '例如：洗衣精、衛生紙', okText: '新增' });
    if (!name) return;
    if (state.groups.find(g => g.name === name)) { toast('已有同名群組'); return; }
    await createGroup(name);
    renderCompare();
  }

  async function groupMenu(gid) {
    const g = groupById(gid);
    if (!g) return;
    const ms = membersOf(gid);
    const choice = await actionSheet(g.name, [
      { label: '重新命名', value: 'rename' },
      { label: '刪除群組', value: 'delete', danger: true }
    ]);
    if (choice === 'rename') {
      const name = await ask({ title: '重新命名群組', value: g.name, okText: '儲存' });
      if (!name) return;
      g.name = name;
      await dbPut('groups', g);
      renderCompare();
    }
    if (choice === 'delete') {
      const ok = await confirmBox({ title: `刪除「${g.name}」？`, message: ms.length ? `${ms.length} 項商品會移出比價（購物清單裡的品項不會被刪除）。` : '', okText: '刪除', danger: true });
      if (!ok) return;
      for (const m of ms) { m.groupId = null; await dbPut('items', m); renderItems(m.catId); }
      state.groups = state.groups.filter(x => x.id !== gid);
      await dbDel('groups', gid);
      renderCompare();
    }
  }

  async function memberMenu(id) {
    const m = itemById(id);
    if (!m) return;
    const choice = await actionSheet(m.name, [
      { label: '編輯價格', value: 'price' },
      { label: '換到其他群組', value: 'move' },
      { label: '移出群組', value: 'remove', danger: true }
    ]);
    if (choice === 'price') priceEditor(m);
    if (choice === 'move') compareFlow(id);
    if (choice === 'remove') { m.groupId = null; await dbPut('items', m); refreshAfterCompare(m); toast('已移出群組'); }
  }

  /* ---------------- 規格比較（與比價分開管理） ---------------- */
  const specGroupById = id => state.specGroups.find(g => g.id === id);
  const toNum = v => { const n = parseFloat(String(v ?? '').replace(/[^\d.]/g, '')); return isFinite(n) ? n : null; };
  const fmtNum = n => Number(n).toLocaleString('zh-TW', { maximumFractionDigits: 2 });
  function specTotal(it) {
    const sp = it.spec || {};
    const a = toNum(sp.value), b = toNum(sp.qty);
    return a != null && b != null && a * b > 0 ? a * b : null;
  }

  // 常用單位（快速選擇）
  const UNIT_PRESETS = [
    { label: '容量', units: ['ml', 'L'] },
    { label: '重量', units: ['g', 'kg'] },
    { label: '數量', units: ['張', '抽', '片', '顆', '入', '包', '捲', '個'] },
    { label: '長度', units: ['cm', 'm'] }
  ];
  const PRESET_SET = new Set(UNIT_PRESETS.flatMap(p => p.units));
  const customUnits = () => [...new Set(state.specGroups.map(g => g.unit).filter(u => u && !PRESET_SET.has(u)))];

  // 舊版（v2）把規格存在比價群組上 → 自動搬到新的規格群組
  async function migrateSpecGroups() {
    if (state.specGroups.length || state.items.some(i => i.specGroupId)) return;
    for (const g of state.groups) {
      const ms = state.items.filter(i => i.groupId === g.id && i.spec && (i.spec.value || i.spec.qty));
      if (!ms.length) continue;
      const sg = await createGroup(g.name, 'spec');
      if (g.unit) { sg.unit = g.unit; await dbPut('specGroups', sg); }
      for (const m of ms) { m.specGroupId = sg.id; await dbPut('items', m); }
    }
  }

  // 價格來源：有在「比價」且填過價格 → 自動用比價的最低價；否則用規格比較裡手動填的價格
  function specPriceOf(it) {
    const inCmp = it.groupId && groupById(it.groupId);
    const b = inCmp ? bestPrice(it) : null;
    if (b) return { price: b.price, store: b.store, linked: true };
    const p = toNum(it.specPrice);
    return p != null && p > 0 ? { price: p, store: '', linked: false } : null;
  }
  function specUnitPrice(it) {
    const t = specTotal(it), p = specPriceOf(it);
    return t && p ? p.price / t : null;
  }
  // 自動挑好讀的基準：NT$0.0363/ml → NT$3.63 / 100ml
  function fmtUnitPrice(per, unit) {
    // 基準只用 1、100、1000…（每 100ml、每 100 抽 比較直覺）
    let f = 1;
    if (per < 1) { f = 100; while (per * f < 1 && f < 1e6) f *= 10; }
    return `NT$${(per * f).toFixed(2)} / ${f > 1 ? fmtNum(f) : ''}${unit || '單位'}`;
  }
  // 依群組的比較目標（下拉選單）決定冠軍：總量（預設）或單位價格
  function specWinner(gid) {
    const g = specGroupById(gid);
    if (!g) return null;
    const ms = itemsIn('spec', gid);
    if (g.target === 'unit') {
      const priced = ms.filter(m => specUnitPrice(m) != null);
      if (priced.length < 2) return null;
      return { item: priced.reduce((a, b) => (specUnitPrice(b) < specUnitPrice(a) ? b : a)), kind: 'value' };
    }
    const sized = ms.filter(m => specTotal(m));
    if (sized.length < 2) return null;
    const min = g.better === 'min';
    return { item: sized.reduce((a, b) => (min ? specTotal(b) < specTotal(a) : specTotal(b) > specTotal(a)) ? b : a), kind: 'amount' };
  }
  // 購物清單的類別名稱，例如「3coin」
  const catLabel = it => { const c = catById(it.catId); return c ? `<span class="sl-cat-label">${esc(c.name)}</span>` : ''; };
  const catText = it => { const c = catById(it.catId); return c ? c.name + ' ' : ''; };
  function specSummary() {
    const sum = $('[data-page="spec"] .sl-summary');
    if (!sum) return;
    const filled = state.items.filter(i => i.specGroupId && specGroupById(i.specGroupId) && specTotal(i)).length;
    sum.textContent = state.specGroups.length ? `${state.specGroups.length} 個群組・${filled} 項已填規格` : '比較數值 × 單一數量 = 總量';
  }

  // 點縮圖右下角的尺 → 選規格群組 → 填規格
  async function specFlow(id) {
    const it = itemById(id);
    if (!it) return;
    const r = await pickGroup(it, 'spec');
    if (r === null) return;
    if (r === '__remove') {
      it.specGroupId = null;
      await dbPut('items', it);
      refreshAfterCompare(it);
      toast('已移出規格比較');
      return;
    }
    it.specGroupId = r;
    await dbPut('items', it);
    refreshAfterCompare(it);
    await specEditor(it);
  }

  // 單位晶片（快速選擇）
  function unitChipsHTML(selected, grouped) {
    const chip = u => `<button type="button" class="sl-uchip${u === selected ? ' on' : ''}" data-unit="${esc(u)}">${esc(u)}</button>`;
    const customs = customUnits();
    if (grouped) {
      return UNIT_PRESETS.map(p => `
          <div class="sl-ugroup"><span class="sl-ulabel">${p.label}</span><div class="sl-uchips">${p.units.map(chip).join('')}</div></div>`).join('')
        + (customs.length ? `<div class="sl-ugroup"><span class="sl-ulabel">自訂</span><div class="sl-uchips">${customs.map(chip).join('')}</div></div>` : '');
    }
    return `<div class="sl-uchips sl-uchips-row">${[...UNIT_PRESETS.flatMap(p => p.units), ...customs].map(chip).join('')}
      <button type="button" class="sl-uchip sl-uchip-add" data-unit-custom>＋自訂</button></div>`;
  }

  // 填規格視窗
  function specEditor(it) {
    return new Promise(resolve => {
      const g = specGroupById(it.specGroupId);
      if (!g) { resolve(); return; }
      const sp = it.spec || {};
      showOverlay(`
        <div class="sl-dialog sl-wide" role="dialog" aria-modal="true">
          <div class="sl-pe-head">
            <span class="sl-pe-thumb">${it.images && it.images[0] ? `<img data-img="${it.images[0]}" alt="">` : ICON.tileEmpty}</span>
            <div class="sl-pe-title">
              <h3>${catLabel(it)}${esc(it.name)}</h3>
              <p>規格群組：${esc(g.name)}</p>
            </div>
          </div>
          <div class="sl-se-label">單位 <small>（整個群組共用）</small></div>
          <div class="sl-se-units">${unitChipsHTML(g.unit, false)}</div>
          <div class="sl-se-custom" hidden>
            <div class="sl-inline">
              <input class="sl-field" type="text" placeholder="自訂單位，例如：粒、瓶" enterkeyhint="done" autocomplete="off">
              <button type="button" class="sl-mini-btn" data-r="unit-ok">套用</button>
            </div>
          </div>
          <div class="sl-spec-calc sl-se-calc">
            <label class="sl-spec-f"><small>比較數值</small>
              <input class="sl-spec-in" data-k="value" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" value="${esc(sp.value ?? '')}" placeholder="例 2000"></label>
            <span class="sl-op">×</span>
            <label class="sl-spec-f"><small>單一數量</small>
              <input class="sl-spec-in" data-k="qty" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" value="${esc(sp.qty ?? '')}" placeholder="例 3"></label>
            <span class="sl-op">=</span>
            <span class="sl-spec-total"><small>總量</small><b>—</b></span>
          </div>
          ${(() => {
            const p = specPriceOf(it);
            return `<div class="sl-spec-calc sl-se-calc sl-spec-pricerow">
              ${p && p.linked
                ? `<span class="sl-sp-linked is-static"><small>價格・來自比價</small><b>${fmt(p.price)}<em>${esc(p.store)}</em></b></span>`
                : `<label class="sl-spec-f sl-sp-field"><small>價格</small>
                     <span class="sl-sp-wrap"><i>NT$</i><input class="sl-spec-in" data-k="price" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" value="${esc(it.specPrice ?? '')}" placeholder="選填"></span></label>`}
              <span class="sl-op">→</span>
              <span class="sl-spec-total sl-spec-unitp"><small>單位價格</small><b>—</b></span>
            </div>
            ${p && p.linked ? '' : '<p class="sl-se-hint">這項商品沒有在比價，可以直接在這裡填價格</p>'}`;
          })()}
          <div class="sl-dialog-btns">
            <button type="button" data-r="ok" class="strong">完成</button>
          </div>
        </div>`, () => done());
      hydrateImages(overlay);
      const box = $('.sl-dialog', overlay);
      const vIn = $('[data-k="value"]', box), qIn = $('[data-k="qty"]', box);
      const totalEl = $('.sl-spec-calc:not(.sl-spec-pricerow) .sl-spec-total b', box);
      const pIn = $('[data-k="price"]', box);
      const upEl = $('.sl-spec-unitp b', box);
      const customBox = $('.sl-se-custom', box), customIn = $('input', customBox);
      let closed = false;
      function paintTotal() {
        const t = specTotal({ spec: { value: vIn.value, qty: qIn.value } });
        totalEl.textContent = t != null ? fmtNum(t) + (g.unit ? ' ' + g.unit : '') : '—';
        const linked = specPriceOf(it);
        const price = linked && linked.linked ? linked.price : (pIn ? toNum(pIn.value) : null);
        upEl.textContent = t && price ? fmtUnitPrice(price / t, g.unit) : '—';
      }
      function bindChips() {
        $$('.sl-uchip[data-unit]', box).forEach(b => {
          b.onclick = () => setUnit(g.unit === b.dataset.unit ? '' : b.dataset.unit);
        });
        const add = $('[data-unit-custom]', box);
        add.onclick = () => { customBox.hidden = !customBox.hidden; if (!customBox.hidden) customIn.focus(); };
      }
      async function setUnit(u) {
        g.unit = u || '';
        await dbPut('specGroups', g);
        $('.sl-se-units', box).innerHTML = unitChipsHTML(g.unit, false);
        bindChips();
        const on = $('.sl-uchip.on', box);
        if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
        paintTotal();
      }
      async function applyCustom() {
        const u = customIn.value.trim();
        if (!u) { customIn.focus(); return; }
        customIn.value = '';
        customBox.hidden = true;
        await setUnit(u);
      }
      async function save() {
        it.spec = { value: vIn.value.trim(), qty: qIn.value.trim() };
        if (pIn) it.specPrice = pIn.value.trim();
        await dbPut('items', it);
      }
      async function done() {
        if (closed) return;
        closed = true;
        if (document.activeElement) document.activeElement.blur();
        await save();
        hideOverlay();
        refreshAfterCompare(it);
        resolve();
      }
      vIn.oninput = qIn.oninput = paintTotal;
      if (pIn) {
        pIn.oninput = paintTotal;
        pIn.onkeydown = e => { if (isEnter(e)) { e.preventDefault(); done(); } };
      }
      vIn.onkeydown = e => { if (isEnter(e)) { e.preventDefault(); qIn.focus(); } };
      qIn.onkeydown = e => { if (isEnter(e)) { e.preventDefault(); if (pIn) pIn.focus(); else done(); } };
      customIn.onkeydown = e => { if (isEnter(e)) { e.preventDefault(); applyCustom(); } };
      $('[data-r="unit-ok"]', box).onclick = applyCustom;
      $('[data-r="ok"]', box).onclick = done;
      bindChips();
      paintTotal();
      const on = $('.sl-uchip.on', box);
      if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }

  // 單位選擇視窗（從規格比較分頁開啟）
  function unitPicker(g) {
    return new Promise(resolve => {
      let sel = g.unit || '';
      showOverlay(`
        <div class="sl-dialog sl-wide" role="dialog" aria-modal="true">
          <h3>「${esc(g.name)}」的單位</h3>
          <p>點選常用單位，或在下方自訂</p>
          <div class="sl-up-groups"></div>
          <div class="sl-inline" style="margin-top:12px">
            <input class="sl-field" type="text" placeholder="自訂單位，例如：粒、瓶" enterkeyhint="done" autocomplete="off">
            <button type="button" class="sl-mini-btn" data-r="new">套用</button>
          </div>
          <div class="sl-dialog-btns">
            <button type="button" data-r="cancel">取消</button>
            <button type="button" data-r="ok" class="strong">儲存</button>
          </div>
        </div>`, () => done(null));
      const wrap = $('.sl-up-groups', overlay);
      const input = $('.sl-inline input', overlay);
      function paint() {
        wrap.innerHTML = unitChipsHTML(sel, true) + (sel && !PRESET_SET.has(sel) && !customUnits().includes(sel)
          ? `<div class="sl-ugroup"><span class="sl-ulabel">自訂</span><div class="sl-uchips"><button type="button" class="sl-uchip on" data-unit="${esc(sel)}">${esc(sel)}</button></div></div>` : '');
        $$('.sl-uchip[data-unit]', wrap).forEach(b => { b.onclick = () => { sel = sel === b.dataset.unit ? '' : b.dataset.unit; paint(); }; });
      }
      function applyCustom() { const u = input.value.trim(); if (!u) { input.focus(); return; } sel = u; input.value = ''; input.blur(); paint(); }
      function done(v) { input.blur(); hideOverlay(); resolve(v); }
      $('[data-r="new"]', overlay).onclick = applyCustom;
      input.onkeydown = e => { if (isEnter(e)) { e.preventDefault(); applyCustom(); } };
      $('[data-r="cancel"]', overlay).onclick = () => done(null);
      $('[data-r="ok"]', overlay).onclick = () => done(sel);
      paint();
    });
  }

  async function setSpecUnit(gid) {
    const g = specGroupById(gid);
    if (!g) return;
    const u = await unitPicker(g);
    if (u === null) return;
    g.unit = u;
    await dbPut('specGroups', g);
    renderCompare();
  }

  function renderSpec() {
    const main = $('[data-page="spec"] .sl-list');
    if (!main) return;
    specSummary();
    if (!state.specGroups.length) {
      main.innerHTML = `
        <div class="sl-empty">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${ICON.ruler.replace(/^<svg[^>]*>|<\/svg>$/g, '')}</svg>
          <h2>還沒有規格群組</h2>
          <p>先建立群組（例如「衛生紙」），<br>再到購物清單點商品縮圖右下角的尺加入。</p>
          <button class="sl-btn-pill" data-act="add-spec-group">${ICON.plusSm}新增第一個群組</button>
        </div>`;
      return;
    }
    main.innerHTML = state.specGroups.map(specGroupHTML).join('');
    hydrateImages(main);
    state.specGroups.forEach(g => updateSpecGroup(g.id));
  }

  function specGroupHTML(g) {
    const ms = itemsIn('spec', g.id);
    return `
      <section class="sl-cat sl-sgroup${g.collapsed ? ' collapsed' : ''}" data-sgroup="${g.id}">
        <div class="sl-cat-head">
          <div class="sl-cat-toggle" data-act="g-collapse" role="button" tabindex="0" aria-expanded="${!g.collapsed}">
            ${ICON.chev}
            <span class="sl-cat-name">${esc(g.name)}</span>
            <label class="sl-target" aria-label="比較目標">
              <select data-sgtarget="${g.id}">
                <option value="total"${g.target !== 'unit' ? ' selected' : ''}>比總量</option>
                <option value="unit"${g.target === 'unit' ? ' selected' : ''}>比單位價格</option>
              </select>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </label>
          </div>
          <button class="sl-unit-chip${g.unit ? ' set' : ''}" data-act="set-unit">${g.unit ? '單位：' + esc(g.unit) : '＋單位'}</button>
          <button class="sl-icon-btn" data-act="spec-group-menu" aria-label="群組選項">${ICON.more}</button>
        </div>
        <div class="sl-g-best" hidden></div>
        ${ms.length
          ? `<ul class="sl-specs">${ms.map(specRowHTML).join('')}</ul>`
          : `<p class="sl-g-empty">到購物清單點商品縮圖右下角的 <span class="sl-inline-ic">${ICON.ruler}</span> 加入這個群組</p>`}
      </section>`;
  }

  function specRowHTML(m) {
    const sp = m.spec || {};
    return `
      <li class="sl-spec-row" data-id="${m.id}">
        <div class="sl-spec-top">
          <button type="button" class="sl-m-thumb sl-thumb-btn" data-act="open-detail" aria-label="查看 ${esc(m.name)} 的細項">
            ${m.images && m.images[0] ? `<img data-img="${m.images[0]}" alt="">` : ICON.tileEmpty}
          </button>
          <span class="sl-m-name">${catLabel(m)}${esc(m.name)}</span>
          <span class="sl-spec-tag"></span>
          <button type="button" class="sl-icon-btn sl-spec-more" data-act="spec-menu" aria-label="更多選項">${ICON.more}</button>
        </div>
        <div class="sl-spec-grid">
          <label class="sl-spec-f"><small>比較數值</small>
            <input class="sl-spec-in" data-k="value" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" value="${esc(sp.value ?? '')}" placeholder="例 2000"></label>
          <span class="sl-op">×</span>
          <label class="sl-spec-f"><small>單一數量</small>
            <input class="sl-spec-in" data-k="qty" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" value="${esc(sp.qty ?? '')}" placeholder="例 3"></label>
          <span class="sl-op">=</span>
          <span class="sl-spec-total"><small>總量</small><b>—</b></span>
          ${specPriceCellHTML(m)}
        </div>
        <div class="sl-spec-foot"><span class="sl-spec-unitp">單位價格<b>—</b></span></div>
      </li>`;
  }

  // 價格欄：連動比價（點了可編輯比價價格）或手動填入
  function specPriceCellHTML(m) {
    const p = specPriceOf(m);
    return p && p.linked
      ? `<button type="button" class="sl-sp-linked" data-act="spec-edit-price" aria-label="編輯比價價格">
           <small>價格・比價</small>
           <b><i>$</i>${fmtNum(p.price)}</b>
         </button>`
      : `<label class="sl-spec-f sl-sp-field"><small>價格</small>
           <span class="sl-sp-wrap"><i>$</i><input class="sl-spec-in" data-k="price" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" value="${esc(m.specPrice ?? '')}" placeholder="選填"></span></label>`;
  }

  // 只更新數字與標記，不重畫輸入框（打字時不會跳掉）
  function updateSpecGroup(gid) {
    const sec = $(`[data-page="spec"] .sl-sgroup[data-sgroup="${gid}"]`);
    const g = specGroupById(gid);
    if (!sec || !g) return;
    const unit = g.unit || '';
    const win = specWinner(gid);
    const tagText = !win ? '' : win.kind === 'value' ? '最划算' : (g.better === 'min' ? '總量最少' : '總量最多');
    $$('.sl-spec-row', sec).forEach(row => {
      const m = itemById(row.dataset.id);
      if (!m) return;
      const t = specTotal(m), up = specUnitPrice(m);
      $('.sl-spec-total b', row).textContent = t != null ? fmtNum(t) + (unit ? ' ' + unit : '') : '—';
      const upEl = $('.sl-spec-unitp b', row);
      upEl.textContent = up != null ? fmtUnitPrice(up, unit) : '—';
      row.classList.toggle('target-unit', g.target === 'unit');
      const isW = !!win && win.item === m;
      row.classList.toggle('best', isW && win.kind === 'amount');
      row.classList.toggle('best-value', isW && win.kind === 'value');
      $('.sl-spec-tag', row).innerHTML = isW ? `<span class="sl-best-tag">${ICON.crown}${tagText}</span>` : '';
    });
    const box = $('.sl-g-best', sec);
    if (!win) {
      const needPrice = g.target === 'unit' && itemsIn('spec', gid).length >= 2;
      box.hidden = !needPrice;
      box.innerHTML = needPrice ? `<span class="sl-g-best-ic">${ICON.crown}</span><span>比單位價格需要兩項以上都填好規格與價格</span>` : '';
      return;
    }
    const w = win.item, wp = specPriceOf(w);
    box.hidden = false;
    box.innerHTML = win.kind === 'value'
      ? `<span class="sl-g-best-ic">${ICON.crown}</span>
         <span>最划算：<b>${esc(catText(w) + w.name)}</b><br><small>${fmt(wp.price)}${wp.store ? '（' + esc(wp.store) + '）' : ''}・總量 ${fmtNum(specTotal(w))}${esc(unit)}</small></span>
         <span class="sl-g-best-p sm">${fmtUnitPrice(specUnitPrice(w), unit)}</span>`
      : `<span class="sl-g-best-ic">${ICON.crown}</span>
         <span>${tagText}：<b>${esc(catText(w) + w.name)}</b><br><small>${esc(w.spec.value)}${esc(unit)} × ${esc(w.spec.qty)}</small></span>
         <span class="sl-g-best-p sm">${fmtNum(specTotal(w))} ${esc(unit)}</span>`;
  }

  async function addSpecGroup() {
    const name = await ask({ title: '新增規格比較群組', placeholder: '例如：衛生紙、牛奶', okText: '新增' });
    if (!name) return;
    if (state.specGroups.find(g => g.name === name)) { toast('已有同名群組'); return; }
    const g = await createGroup(name, 'spec');
    renderCompare();
    setSpecUnit(g.id); // 建立後直接選單位
  }

  async function specGroupMenu(gid) {
    const g = specGroupById(gid);
    if (!g) return;
    const ms = itemsIn('spec', gid);
    const choice = await actionSheet(g.name, [
      { label: '重新命名', value: 'rename' },
      { label: g.unit ? `更改單位（目前：${g.unit}）` : '設定單位', value: 'unit' },
      { label: g.better === 'min' ? '改為：總量越多越好' : '改為：總量越少越好', value: 'better' },
      { label: '刪除群組', value: 'delete', danger: true }
    ]);
    if (choice === 'rename') {
      const name = await ask({ title: '重新命名群組', value: g.name, okText: '儲存' });
      if (!name) return;
      g.name = name;
      await dbPut('specGroups', g);
      renderCompare();
    }
    if (choice === 'unit') setSpecUnit(gid);
    if (choice === 'better') {
      g.better = g.better === 'min' ? 'max' : 'min';
      await dbPut('specGroups', g);
      renderCompare();
      toast(g.better === 'min' ? '改為標示總量最少的' : '改為標示總量最多的');
    }
    if (choice === 'delete') {
      const ok = await confirmBox({ title: `刪除「${g.name}」？`, message: ms.length ? `${ms.length} 項商品會移出規格比較（購物清單裡的品項不會被刪除）。` : '', okText: '刪除', danger: true });
      if (!ok) return;
      for (const m of ms) { m.specGroupId = null; await dbPut('items', m); renderItems(m.catId); }
      state.specGroups = state.specGroups.filter(x => x.id !== gid);
      await dbDel('specGroups', gid);
      renderCompare();
    }
  }

  async function specMemberMenu(id) {
    const m = itemById(id);
    if (!m) return;
    const choice = await actionSheet(catText(m) + m.name, [
      { label: '編輯規格與價格', value: 'edit' },
      { label: '換到其他群組', value: 'move' },
      { label: '移出群組', value: 'remove', danger: true }
    ]);
    if (choice === 'edit') specEditor(m);
    if (choice === 'move') specFlow(id);
    if (choice === 'remove') { m.specGroupId = null; await dbPut('items', m); refreshAfterCompare(m); toast('已移出群組'); }
  }

  const specTimers = new Map();
  root.addEventListener('input', e => {
    const t = e.target;
    if (!t.matches('.sl-specs .sl-spec-in')) return;
    const m = itemById(t.closest('.sl-spec-row').dataset.id);
    if (!m) return;
    if (t.dataset.k === 'price') m.specPrice = t.value.trim();
    else m.spec = Object.assign({}, m.spec, { [t.dataset.k]: t.value.trim() });
    clearTimeout(specTimers.get(m.id));
    specTimers.set(m.id, setTimeout(() => dbPut('items', m), 400));
    updateSpecGroup(m.specGroupId);
    specSummary();
  });
  root.addEventListener('change', async e => {
    const sel = e.target.closest && e.target.closest('select[data-sgtarget]');
    if (!sel) return;
    const g = specGroupById(sel.dataset.sgtarget);
    if (!g) return;
    g.target = sel.value;
    await dbPut('specGroups', g);
    updateSpecGroup(g.id);
  });
  // 離開輸入框時立即存檔，並更新購物清單上的總量標籤
  root.addEventListener('change', e => {
    if (!e.target.matches('.sl-specs .sl-spec-in')) return;
    const m = itemById(e.target.closest('.sl-spec-row').dataset.id);
    if (m) { clearTimeout(specTimers.get(m.id)); dbPut('items', m); renderItems(m.catId); }
  });
  root.addEventListener('keydown', e => {
    const t = e.target;
    if (!t.matches || !t.matches('.sl-specs .sl-spec-in') || !isEnter(e)) return;
    e.preventDefault();
    const next = { value: 'qty', qty: 'price' }[t.dataset.k];
    const nextEl = next && $(`.sl-spec-in[data-k="${next}"]`, t.closest('.sl-spec-row'));
    if (nextEl) nextEl.focus(); else t.blur();
  });

  /* ---------------- 底部 Tab Bar ---------------- */
  const scrollMemo = {};
  let currentTab = 'list';
  function switchTab(name, instant) {
    if (name === currentTab && !instant) {
      window.scrollTo({ top: 0, behavior: 'smooth' }); // 再點一次同分頁 → 回到頂端
      return;
    }
    scrollMemo[currentTab] = window.scrollY;
    currentTab = name;
    if (name === 'compare' || name === 'spec') renderCompare();
    $$('.sl-page').forEach(p => { p.hidden = p.dataset.page !== name; });
    $$('.sl-tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === name)));
    window.scrollTo(0, scrollMemo[name] || 0);
    try { localStorage.setItem('sl-tab', name); } catch (e) {}
  }
  $$('.sl-tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
  try { const saved = localStorage.getItem('sl-tab'); if (saved && saved !== 'list' && $(`.sl-page[data-page="${saved}"]`)) switchTab(saved, true); } catch (e) {}

  /* ---------------- 事件 ---------------- */
  root.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || !root.contains(el)) return;
    const sec = el.closest('.sl-cat');
    const li = el.closest('.sl-item');
    switch (el.dataset.act) {
      case 'add-cat': addCategory(); break;
      case 'add-item': submitAddRow(el.closest('.sl-add')); break;
      case 'compare': compareFlow(li.dataset.id); break;
      case 'd-compare': compareFlow(currentId); break;
      case 'add-group': addGroupFromPage(); break;
      case 'group-menu': groupMenu(el.closest('.sl-group').dataset.group); break;
      case 'edit-price': { const m = itemById(el.closest('.sl-member').dataset.id); if (m) priceEditor(m); break; }
      case 'member-menu': memberMenu(el.closest('.sl-member').dataset.id); break;
      case 'g-collapse': {
        if (e.target.closest('.sl-target')) break; // 點下拉選單時不收合
        const sec = el.closest('.sl-group, .sl-sgroup');
        const isSpec = sec.classList.contains('sl-sgroup');
        const g = isSpec ? specGroupById(sec.dataset.sgroup) : groupById(sec.dataset.group);
        if (!g) break;
        g.collapsed = !g.collapsed;
        dbPut(isSpec ? 'specGroups' : 'groups', g);
        sec.classList.toggle('collapsed', g.collapsed);
        el.setAttribute('aria-expanded', String(!g.collapsed));
        break;
      }
      case 'open-detail': openDetail(el.closest('[data-id]').dataset.id); break;
      case 'spec-edit-price': { const m = itemById(el.closest('.sl-spec-row').dataset.id); if (m) priceEditor(m); break; }
      case 'spec-menu': specMemberMenu(el.closest('.sl-spec-row').dataset.id); break;
      case 'set-unit': setSpecUnit(el.closest('.sl-sgroup').dataset.sgroup); break;
      case 'spec-group-menu': specGroupMenu(el.closest('.sl-sgroup').dataset.sgroup); break;
      case 'add-spec-group': addSpecGroup(); break;
      case 'spec': specFlow(li.dataset.id); break;
      case 'd-spec': specFlow(currentId); break;
      case 'collapse': toggleCollapse(sec.dataset.cat); break;
      case 'cat-menu': catMenu(sec.dataset.cat); break;
      case 'open': openDetail(li.dataset.id); break;
      case 'back': closeDetail(); break;
      case 'add-photo': $('.sl-file').click(); break;
      case 'view': openViewer(+el.dataset.index || 0); break;
      case 'close-viewer': closeViewer(); break;
      case 'delete-photo': deleteViewerPhoto(); break;
      case 'cover': setCover(); break;
      case 'delete-item': deleteCurrentItem(); break;
    }
  });

  root.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('.sl-item input[type="checkbox"]')) {
      const li = t.closest('.sl-item');
      toggleFromList(li.dataset.id, t.checked, li);
    } else if (t === doneSwitch) {
      const it = itemById(currentId);
      if (it) setDone(it, t.checked);
    } else if (t.matches('.sl-file')) {
      const files = Array.from(t.files || []);
      t.value = '';
      addPhotos(files);
    }
  });

  // 注音／拼音選字中按 Enter 不算送出
  function isEnter(e) { return e.key === 'Enter' && !e.isComposing && e.keyCode !== 229; }

  function submitAddRow(row) {
    const input = $('input', row);
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    addItem(row.dataset.cat, name);
    input.value = '';
    input.focus(); // 保持鍵盤開啟，方便連續輸入
  }
  root.addEventListener('keydown', e => {
    if (!isEnter(e) || !e.target.matches('.sl-add input')) return;
    e.preventDefault();
    submitAddRow(e.target.closest('.sl-add'));
  });
  // 按「加入」時避免輸入框先失去焦點（鍵盤收起）
  root.addEventListener('pointerdown', e => { if (e.target.closest('[data-act="add-item"], [data-r="ok"], [data-r="add"], [data-r="new"], [data-r="unit-ok"]')) e.preventDefault(); });

  nameInput.addEventListener('input', saveSoon);
  nameInput.addEventListener('keydown', e => { if (isEnter(e)) nameInput.blur(); });
  noteInput.addEventListener('input', () => { autoGrow(); saveSoon(); });

  // App 切到背景時立即存檔
  document.addEventListener('visibilitychange', () => { if (document.hidden && currentId) flushDetail(); });
  window.addEventListener('pagehide', () => { if (currentId) flushDetail(); });

  /* ---------------- 啟動 ---------------- */
  (async function init() {
    try {
      db = await openDB();
    } catch (err) {
      console.warn('本機資料庫無法使用，改用暫存模式：', err);
      db = null;
      setTimeout(() => toast('預覽模式：資料不會被保存', 3500), 300);
    }
    try {
      const [cats, items, groups, specGroups] = await Promise.all([dbAll('cats'), dbAll('items'), dbAll('groups'), dbAll('specGroups')]);
      state.groups = groups.sort((a, b) => a.order - b.order);
      state.specGroups = specGroups.sort((a, b) => a.order - b.order);
      state.cats = cats.sort((a, b) => a.order - b.order);
      state.items = items;
      await migrateSpecGroups();
      renderAll();
      // 請求「持久儲存」，降低 iOS 自動清除資料的機率
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    } catch (err) {
      console.error(err);
      $('[data-page="list"] .sl-list').innerHTML = '<div class="sl-empty"><h2>資料讀取失敗</h2><p>請重新整理頁面再試一次。</p></div>';
    }
  })();
})();
</script>
</body>
</html>
